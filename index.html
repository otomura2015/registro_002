
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UNKNOWN</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .tela {
            width: 90%;
            max-width: 750px;
            text-align: center;
            animation: aparecer 2s ease;
        }

        .titulo {
            font-size: clamp(35px, 8vw, 65px);
            letter-spacing: 12px;
            margin-bottom: 35px;
            animation: piscar 4s infinite;
        }

        .linha {
            width: 100%;
            height: 1px;
            background: #333;
            margin-bottom: 35px;
        }

        .codigo {
            font-size: clamp(45px, 10vw, 75px);
            letter-spacing: 15px;
            margin-bottom: 5px;
        }

        .classificacao {
            font-size: 20px;
            color: #888;
            letter-spacing: 5px;
        }

        .registro {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
        }

        #mensagem {
            margin-top: 55px;
            min-height: 180px;
            font-size: 16px;
            line-height: 2;
            white-space: pre-line;
            text-align: left;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 17px;
            background: white;
            animation: cursor 0.8s infinite;
            vertical-align: middle;
        }

        .instrucao {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #333;
            text-align: left;
            animation: aparecer 2s ease;
        }

        .instrucao h2 {
            font-size: 15px;
            font-weight: normal;
            color: #888;
        }

        .arquivo {
            display: block;
            padding: 15px;
            background: #111;
            border: 1px solid #444;
            color: white;
            margin-top: 15px;
            font-size: 17px;
        }

        .aviso {
            margin-top: 20px;
            color: #555;
            font-size: 11px;
        }

        @keyframes cursor {
            50% {
                opacity: 0;
            }
        }

        @keyframes piscar {
            0%, 95%, 100% {
                opacity: 1;
            }
            96%, 98% {
                opacity: 0.3;
            }
        }

        @keyframes aparecer {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 500px) {
            .titulo {
                letter-spacing: 6px;
            }

            #mensagem {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="tela">

        <header>
            <div class="titulo">UNKNOWN</div>
            <div class="linha"></div>

            <div class="codigo">EEB</div>
            <div class="classificacao">+13</div>

            <div class="registro">
                REGISTRO DE EMERGÊNCIA — 002
            </div>
        </header>

        <div id="mensagem"></div>

        <section class="instrucao" id="instrucao">
            <h2>INSTRUÇÃO DO SISTEMA</h2>

            <p>
                Abra o arquivo abaixo na pasta do jogo.
            </p>

            <div class="arquivo">
                &gt; terminal.py
            </div>

            <p class="aviso">
                O arquivo deve ser aberto manualmente.
            </p>
        </section>

    </main>

    <script>
        const mensagem = document.getElementById("mensagem");
        const instrucao = document.getElementById("instrucao");

        const linhas = [
            "Se você está vendo isto, o programa funcionou.",
            "",
            "Agora precisamos verificar uma coisa."
        ];

        let linhaAtual = 0;
        let letraAtual = 0;

        function digitar() {
            if (linhaAtual >= linhas.length) {
                mensagem.innerHTML +=
                    '<span class="cursor"></span>';

                setTimeout(() => {
                    mensagem.innerHTML =
                        "Se você está vendo isto, o programa funcionou.\n\n" +
                        "Agora precisamos verificar uma coisa.";

                    setTimeout(() => {
                        instrucao.style.display = "block";
                    }, 1800);
                }, 1200);

                return;
            }

            const linha = linhas[linhaAtual];

            if (letraAtual < linha.length) {
                mensagem.innerHTML += linha.charAt(letraAtual);
                letraAtual++;

                setTimeout(digitar, 45);
            } else {
                mensagem.innerHTML += "\n";
                linhaAtual++;
                letraAtual = 0;

                setTimeout(digitar, 700);
            }
        }

        setTimeout(digitar, 1800);
    </script>

</body>
</html>
